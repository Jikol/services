# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: mc

services:
  server:
    container_name: mc-server
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "25575:25575"
      - "8080:8080"
    environment:
      EULA: true
      VERSION: 1.21.11
      TYPE: paper
      ENABLE_WHITELIST: true
      ICON: https://static-cdn.jtvnw.net/jtv_user_pictures/ba219bf6-78d4-4588-b8de-335813e6e9ec-profile_image-70x70.png
      MAX_PLAYERS: 5
      VIEW_DISTANCE: 32
      SEED: lol
      MODE: survival
      DIFFICULTY: hard
      PVP: false
      SERVER_NAME: aurora
      MEMORY: 2G
      MOTD: ja miluju majkraft je to svet ve kterém jsem rád
      WHITELIST: Jikoll,_Wance_
      PLUGINS: |
        https://hangarcdn.papermc.io/plugins/pop4959/Chunky/versions/1.4.40/PAPER/Chunky-Bukkit-1.4.40.jar
        https://hangarcdn.papermc.io/plugins/Blue/BlueMap/versions/5.16/PAPER/bluemap-5.16-paper.jar
        https://hangarcdn.papermc.io/plugins/hyperdefined/ToolStats/versions/2.0/PAPER/toolstats-2.0.jar
        https://hangarcdn.papermc.io/plugins/jmp/TabTPS/versions/1.3.30/PAPER/tabtps-paper-1.3.30.jar
        https://hangarcdn.papermc.io/plugins/HelpChat/PlaceholderAPI/versions/2.12.2/PAPER/PlaceholderAPI-2.12.2.jar
        https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.7.1/PAPER/ViaVersion-5.7.1.jar
        https://hangarcdn.papermc.io/plugins/ViaVersion/ViaBackwards/versions/5.7.1/PAPER/ViaBackwards-5.7.1.jar
        https://cdn.modrinth.com/data/7cMAqMND/versions/FFERqVWD/Backuper-4.0.3.jar
        https://cdn.modrinth.com/data/LDkz4P10/versions/jOP2uPPT/ChestSort-1.1.jar
    restart: unless-stopped
    volumes:
      - ./data:/data
