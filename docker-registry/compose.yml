# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  docker-registry:
    container_name: docker-registry
    image: registry:2.8.3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 --spider http://${DOCKER_REGISTRY_USERNAME:?error}:${DOCKER_REGISTRY_PASSWORD:?error}@localhost:5000/v2/",
        ]
      interval: 7s
      timeout: 5s
      retries: 3
    volumes:
      - ./data:/var/lib/registry
      - ./auth:/auth:ro
    networks:
      default:
        aliases:
          - ${DOCKER_REGISTRY_HOSTNAME:?error}

  docker-registry-ui:
    container_name: docker-registry-ui
    image: ghcr.io/eznix86/docker-registry-ui:0.5.5
    environment:
      REGISTRY_URL: http://${DOCKER_REGISTRY_HOSTNAME}:5000
      REGISTRY_AUTH: ${AUTH_STRING:?error}
    ports:
      - "5050:80"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q --tries=1 --spider --header "Authorization: Basic $$REGISTRY_AUTH" $$REGISTRY_URL/v2/_catalog',
        ]
      interval: 7s
      timeout: 5s
      retries: 3
    depends_on:
      docker-registry:
        condition: service_healthy
