services:
  docker-registry:
    container_name: docker-registry
    image: registry:2.8.3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/registry
      - ./auth:/auth:ro
    networks:
      default:
        aliases:
          - ${REGISTRY_HOSTNAME:?error}

  docker-registry-ui:
    container_name: docker-registry-ui
    image: ghcr.io/eznix86/docker-registry-ui:0.5.5
    environment:
      REGISTRY_URL: ${REGISTRY_PROTOCOL:?error}://${REGISTRY_HOSTNAME:?error}:${REGISTRY_PORT:-5000}
    ports:
      - "5050:80"
    restart: unless-stopped
