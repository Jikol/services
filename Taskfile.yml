# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: 3

dotenv: [".env.local"]

tasks:
  ## deployment tasks ##
  proxy-manager:compose:
    desc: >
      Run proxy-manager docker compose |
      Usage: task proxy-manager:compose (pm:c) [
      -- [purge] [attach|down];
      ]
    aliases: [pm:c]
    dir: "{{.SERVICE_DIR}}"
    vars:
      SERVICE_DIR: "{{.ROOT_DIR}}/proxy-manager"
      ENVS: []
    requires:
      vars:
        - PROXY_MANAGER_EMAIL
        - PROXY_MANAGER_PASSWORD
    cmds:
      - task: docker:compose
        vars:
          ENVS:
            ref: .ENVS
          CLI_ARGS: "{{.CLI_ARGS}}"
          SERVICE_DIR: "{{.SERVICE_DIR}}"
          PURGE_DIRS: "{{.SERVICE_DIR}}/data {{.SERVICE_DIR}}/letsencrypt"

  docker-registry:compose:
    desc: >
      Run docker-registry docker compose |
      Usage: task docker-registry:compose (dr:c) [
      -- [proxy] [purge] [attach|down];
      ]
    aliases: [dr:c]
    dir: "{{.SERVICE_DIR}}"
    vars:
      SERVICE_DIR: "{{.ROOT_DIR}}/docker-registry"
      AUTH_STRING:
        sh: >-
          printf '%s' "{{.DOCKER_REGISTRY_USERNAME}}:{{.DOCKER_REGISTRY_PASSWORD}}" |
          base64 -w 0
      ENVS:
        - AUTH_STRING={{.AUTH_STRING}}
    requires:
      vars:
        - DOCKER_REGISTRY_HOSTNAME
        - DOCKER_REGISTRY_USERNAME
        - DOCKER_REGISTRY_PASSWORD
    cmds:
      - cmd: sudo rm -rf auth
        if: '{{contains "purge" .CLI_ARGS}}'
      - cmd: sudo mkdir -p auth
      - cmd: >-
          docker run --rm --entrypoint htpasswd httpd:2
          -Bbn {{.DOCKER_REGISTRY_USERNAME}} {{.DOCKER_REGISTRY_PASSWORD}} |
          sudo tee auth/htpasswd > /dev/null
      - task: docker:compose
        vars:
          ENVS:
            ref: .ENVS
          CLI_ARGS: "{{.CLI_ARGS}}"
          SERVICE_DIR: "{{.SERVICE_DIR}}"
          PURGE_DIRS: "{{.SERVICE_DIR}}/data"
          ADDITIONAL_COMPOSE: '{{if contains "proxy" .CLI_ARGS}}compose.proxy.yml{{end}}'
  ## ---------------- ##
  ## internal tasks ##
  docker:compose:
    internal: true
    platforms: [linux]
    dir: "{{.SERVICE_DIR}}"
    vars:
      COMPOSE_FILES: "-f compose.yml{{if .ADDITIONAL_COMPOSE}} -f {{.ADDITIONAL_COMPOSE}}{{end}}"
      COMPOSE_ENV: "{{range .ENVS}}{{.}} {{end}}"
      PURGE_DIRS: '{{.PURGE_DIRS | default ""}}'
    cmds:
      - cmd: |-
          env {{.COMPOSE_ENV}}docker compose {{.COMPOSE_FILES}} down --remove-orphans
          sudo rm -rf {{.PURGE_DIRS}}
        if: '{{contains "purge" .CLI_ARGS}}'
      # prettier-ignore
      - cmd: |-
          env {{.COMPOSE_ENV}}sh -c '
          trap "docker compose {{.COMPOSE_FILES}} down --remove-orphans; exit 0" INT
          docker compose {{.COMPOSE_FILES}} up -d --no-build --force-recreate --wait
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            docker compose {{.COMPOSE_FILES}} logs
            docker compose {{.COMPOSE_FILES}} down --remove-orphans
            exit 1
          fi
          docker compose {{.COMPOSE_FILES}} logs
          '
        if: '{{and (not (contains "attach" .CLI_ARGS)) (not (contains "down" .CLI_ARGS))}}'
      - cmd: |-
          env {{.COMPOSE_ENV}}sh -c '
          trap "docker compose {{.COMPOSE_FILES}} down --remove-orphans; exit 0" INT
          docker compose {{.COMPOSE_FILES}} up -d --no-build --force-recreate --wait
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            docker compose {{.COMPOSE_FILES}} logs
            docker compose {{.COMPOSE_FILES}} down --remove-orphans
            exit 1
          fi
          docker compose {{.COMPOSE_FILES}} logs -f
          docker compose {{.COMPOSE_FILES}} down --remove-orphans
          '
        if: '{{and (contains "attach" .CLI_ARGS) (not (contains "down" .CLI_ARGS))}}'
      - cmd: env {{.COMPOSE_ENV}}docker compose {{.COMPOSE_FILES}} down --remove-orphans
        if: '{{and (contains "down" .CLI_ARGS) (not (contains "attach" .CLI_ARGS))}}'
      - cmd: |-
          echo "Error: invalid CLI_ARGS '{{.CLI_ARGS}}' — attach and down are mutually exclusive"
          exit 1
        if: '{{and (contains "attach" .CLI_ARGS) (contains "down" .CLI_ARGS)}}'
  ## -------------- ##
