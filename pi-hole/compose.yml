name: pihole

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2024.07.0
    environment:
      TZ: "Europe/Prague"
      WEBPASSWORD: "admin"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"
      - "1447:80"
    dns:
      - "127.0.0.1"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq:/etc/dnsmasq.d   
