name: registry

services:
  registry-ui:
    container_name: registry-ui
    image: ghcr.io/eznix86/docker-registry-ui:0.5.5
    environment:
      REGISTRY_URL: http://${REGISTRY_PUBLIC_HOST:?error}:5000
    ports:
      - "5050:80"
    restart: unless-stopped

  registry-server:
    container_name: registry-server
    image: registry:2.8.3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/registry
    networks:
      default:
        aliases:
          - ${REGISTRY_PUBLIC_HOST:?error}
